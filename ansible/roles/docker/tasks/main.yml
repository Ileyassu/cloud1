---
- name: "Installing Docker"
  ansible.builtin.apt: 
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: "Ensure docker is installed"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: "Add ubuntu user to docker group"
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: yes 